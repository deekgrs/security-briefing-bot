name: Daily Security Briefing

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC = 7:17 AM Eastern
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # least privilege: only enough to commit the briefing

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python briefing.py

      - name: Commit briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Briefing for $(date -u +%F)"
          git push